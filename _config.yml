title: Cheaha Notes
description: Documentation for UAB Cheaha compute cluster

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

baseurl: "/cheaha-notes"
url: "https://www.shauritahutchins.com"

search_enabled: true

# Custom color scheme - replaces default purple with blue
color_scheme: custom

# Callout configuration
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green